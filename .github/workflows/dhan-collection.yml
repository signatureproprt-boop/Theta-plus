name: Dhan collection checks
on:
  pull_request:
    paths: ['live-app/**', '.github/workflows/dhan-collection.yml']
  push:
    branches: [main]
    paths: ['live-app/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r live-app/requirements.lock.txt
      - run: PYTHONPATH=live-app python -m pytest -q live-app/tests
      - run: node --test live-app/tests/collection-ui.test.cjs live-app/tests/research-ui.test.cjs live-app/tests/research-live-ui.test.cjs live-app/tests/research-workflow-ui.test.cjs
      - run: node --check live-app/static/research-workflow.js && node --check live-app/static/research-live.js && node --check live-app/static/research.js && node --check live-app/static/collection.js && node --check live-app/static/app.js && node --check live-app/static/token-admin.js
      - run: bash -n live-app/deploy/release-existing.sh

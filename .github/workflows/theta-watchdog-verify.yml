name: Verify Theta automatic restart
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/theta-watchdog-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: theta-plus-production-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved destination and date
        env:
          PROVIDER: ${{ vars.THETA_WIF_PROVIDER }}
          DEPLOYER: ${{ vars.THETA_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          assert datetime.now(ZoneInfo('Asia/Kolkata')).date().isoformat()=='2026-10-24','Authorized closed-market date only'
          assert os.environ['DEPLOYER']=='theta-plus-github@theta-pluse.iam.gserviceaccount.com'
          assert os.environ['PROVIDER']=='projects/261331732835/locations/global/workloadIdentityPools/theta-github-deploy/providers/github'
          PY
      - uses: google-github-actions/auth@v3
        with:
          project_id: theta-pluse
          workload_identity_provider: ${{ vars.THETA_WIF_PROVIDER }}
          service_account: ${{ vars.THETA_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify Scheduler read access propagation
        run: |
          python3 - <<'PY'
          import subprocess,time,re,json
          for attempt in range(12):
              r=subprocess.run(['gcloud','scheduler','jobs','list','--project=theta-pluse','--location=asia-south1','--format=json'],capture_output=True,text=True)
              if r.returncode==0:
                  jobs=json.loads(r.stdout)
                  print(json.dumps({'state':'SCHEDULER_READ_VERIFIED','jobs':[{'name':j.get('name'),'state':j.get('state'),'schedule':j.get('schedule'),'target':j.get('httpTarget',{}).get('uri')} for j in jobs]}))
                  break
              if attempt==11:
                  print(json.dumps({'state':'SCHEDULER_READ_FAILED','diagnostic_tokens':re.findall(r'PERMISSION_DENIED|SERVICE_DISABLED|UNAUTHENTICATED|INVALID_ARGUMENT|NOT_FOUND|cloudscheduler\.[A-Za-z.]+',r.stderr)}))
                  raise SystemExit(1)
              time.sleep(5)
          PY
      - name: Append receipt for completed restart and checkpoint checks
        run: |
          python3 - <<'PYCODE'
          import json,subprocess,re
          from pathlib import Path
          record=json.loads(Path('ops/watchdog-acceptance.json').read_text())
          assert record['data']['verification_evidence']['workflow_job_id']==120866941550
          key=f"{9007199254740991-int(record['id']):016d}"
          uri='gs://theta-pluse-theta-plus-data/records/watchdog_acceptance/'+key+'.json'
          result=subprocess.run(['gcloud','storage','cp','ops/watchdog-acceptance.json',uri,'--if-generation-match=0','--quiet'],capture_output=True,text=True)
          if result.returncode:
              print(json.dumps({'state':'RECEIPT_CREATE_FAILED','diagnostic_tokens':re.findall(r'PERMISSION_DENIED|Precondition|storage\.[A-Za-z.]+|403|412|does not have|AccessDenied',result.stderr)}))
              raise SystemExit(1)
          saved=json.loads(subprocess.check_output(['gcloud','storage','cat',uri],text=True))
          assert saved==record
          print('WATCHDOG_VERIFIED_RECEIPT_SAVED',record['id'])
          PYCODE

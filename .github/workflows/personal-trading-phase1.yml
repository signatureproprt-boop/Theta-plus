name: Personal trading Phase 1 integration and deployment preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['personal-trading-phase1/**', '.github/workflows/personal-trading-phase1.yml']
  pull_request:
    paths: ['personal-trading-phase1/**', '.github/workflows/personal-trading-phase1.yml']
permissions:
  contents: read
jobs:
  integration:
    name: Verify real Docker Timescale Redis and Celery integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: personal-trading-phase1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Prepare isolated CI stack with no Dhan credentials
        run: python ci/check_stack.py bootstrap
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d
      - name: Verify live service integration and non-destructive persistence
        run: |
          docker compose exec -T -e PHASE1_DISPOSABLE_CI=1 api python -c "exec(compile(__import__('sys').stdin.read(), 'check_stack.py', 'exec'))" stack < ci/check_stack.py
          docker compose exec -T worker celery -A app.celery_app:celery_app inspect ping --timeout=10
      - name: Isolated CI service logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Dispose only isolated runner containers
        if: always()
        run: docker compose down

  cloud-target:
    name: Discover persistent deployment target (read-only)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing cloud identity
        env:
          PROVIDER: ${{ vars.THETA_WIF_PROVIDER }}
          DEPLOYER: ${{ vars.THETA_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test "$PROVIDER" = 'projects/261331732835/locations/global/workloadIdentityPools/theta-github-deploy/providers/github'
          test "$DEPLOYER" = 'theta-plus-github@theta-pluse.iam.gserviceaccount.com'
      - uses: google-github-actions/auth@v3
        with:
          project_id: theta-pluse
          workload_identity_provider: ${{ vars.THETA_WIF_PROVIDER }}
          service_account: ${{ vars.THETA_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read Compute Engine target inventory without creating resources
        run: python3 personal-trading-phase1/deploy/inspect_target.py
